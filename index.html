<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원소 기호 풍선 게임</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #f0f8ff; 
            font-family: 'Malgun Gothic', sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh; /* 전체 높이 고정 */
        }
        
        /* 상단 점수 및 시간 UI */
        #ui { 
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: #f0f8ff;
            z-index: 10;
        }
        .info { 
            font-size: 16px; 
            font-weight: bold; 
            background: rgba(255,255,255,0.9); 
            padding: 5px 15px; 
            border-radius: 15px; 
            border: 2px solid #333; 
        }

        /* 게임 영역: 키보드 제외 남은 공간을 꽉 채움 */
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #fff;
            overflow: hidden;
        }
        canvas { 
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 입력 영역: 하단에 고정 */
        #input-box { 
            padding: 10px;
            background: #f0f8ff;
            border-top: 1px solid #ccc;
            z-index: 10;
        }
        input { 
            font-size: 20px; 
            padding: 10px; 
            border-radius: 10px; 
            border: 3px solid #333; 
            width: 80%; 
            max-width: 300px;
            text-align: center; 
            outline: none; 
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="info">점수: <span id="score">0</span></div>
        <div class="info">시간: <span id="timer">02:30</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="input-box">
        <input type="text" id="answer" placeholder="기호 입력" autofocus autocomplete="off">
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const inputElement = document.getElementById('answer');

        // 캔버스 크기를 컨테이너 크기에 맞추는 함수
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let timeLeft = 150; 
        let gameActive = true;
        let balloons = [];

        const elements = [
            { name: "수소", symbol: "H" }, { name: "헬륨", symbol: "He" }, { name: "리튬", symbol: "Li" },
            { name: "베릴륨", symbol: "Be" }, { name: "붕소", symbol: "B" }, { name: "탄소", symbol: "C" },
            { name: "질소", symbol: "N" }, { name: "산소", symbol: "O" }, { name: "플루오린", symbol: "F" },
            { name: "네온", symbol: "Ne" }, { name: "나트륨", symbol: "Na" }, { name: "마그네슘", symbol: "Mg" },
            { name: "알루미늄", symbol: "Al" }, { name: "규소", symbol: "Si" }, { name: "인", symbol: "P" },
            { name: "황", symbol: "S" }, { name: "염소", symbol: "Cl" }, { name: "아연", symbol: "Zn" },
            { name: "칼륨", symbol: "K" }, { name: "칼슘", symbol: "Ca" }, { name: "철", symbol: "Fe" },
            { name: "구리", symbol: "Cu" }, { name: "은", symbol: "Ag" }, { name: "금", symbol: "Au" },
            { name: "바륨", symbol: "Ba" }, { name: "수은", symbol: "Hg" }
        ];

        class Balloon {
            constructor() {
                const currentFirstLetters = balloons.map(b => b.symbol.charAt(0));
                const availableElements = elements.filter(el => {
                    const isNameDuplicate = balloons.some(b => b.name === el.name);
                    const isFirstLetterDuplicate = currentFirstLetters.includes(el.symbol.charAt(0));
                    return !isNameDuplicate && !isFirstLetterDuplicate;
                });

                let el = availableElements.length > 0 ? 
                         availableElements[Math.floor(Math.random() * availableElements.length)] :
                         elements.filter(el => !balloons.some(b => b.name === el.name))[0];

                this.name = el.name;
                this.symbol = el.symbol;
                this.x = Math.random() * (canvas.width - 80) + 40;
                this.y = -50;
                this.baseSize = canvas.width < 500 ? 35 : 45; // 화면 너비에 따라 크기 조절
                this.size = this.baseSize;
                this.speed = Math.random() * 0.5 + 0.4; 
                this.color = `hsl(${Math.random() * 360}, 75%, 65%)`;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.size);
                ctx.lineTo(this.x, this.y + this.size + 15);
                ctx.strokeStyle = "#999";
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.stroke();

                ctx.fillStyle = "white";
                ctx.font = `bold ${this.size * 0.45}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.name, this.x, this.y);
            }

            update() {
                this.y += this.speed;
                // 크기 변화폭을 화면 높이에 맞게 조절
                this.size = this.baseSize + (this.y / canvas.height) * 30;
            }
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (!gameActive) { clearInterval(timerInterval); return; }
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                timerElement.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) {
                    gameActive = false;
                    alert(`시간 종료! 최종 점수: ${score}점`);
                    location.reload();
                }
            }, 1000);
        }

        function spawnBalloon() {
            if (gameActive) {
                if (balloons.length < 5) balloons.push(new Balloon());
                setTimeout(spawnBalloon, 1800);
            }
        }

        function update() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = balloons.length - 1; i >= 0; i--) {
                balloons[i].update();
                balloons[i].draw();
                if (balloons[i].y - balloons[i].size > canvas.height) {
                    balloons.splice(i, 1);
                }
            }
            requestAnimationFrame(update);
        }

        inputElement.addEventListener('input', () => {
            const val = inputElement.value.trim();
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].symbol === val) {
                    let bonus = Math.floor((1 - (balloons[i].y / canvas.height)) * 90) + 10;
                    score += bonus;
                    scoreElement.innerText = score;
                    balloons.splice(i, 1);
                    inputElement.value = "";
                    break;
                }
            }
        });

        startTimer();
        spawnBalloon();
        update();
    </script>
</body>
</html>

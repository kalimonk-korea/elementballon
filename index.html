<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원소 기호 풍선 게임 (화면 축소형)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #f0f8ff; 
            font-family: 'Malgun Gothic', sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 상단 UI: 더 슬림하게 조정 */
        #ui { 
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 5px;
            background: #f0f8ff;
            z-index: 10;
        }
        .info { 
            font-size: 14px; 
            font-weight: bold; 
            background: white; 
            padding: 4px 12px; 
            border-radius: 10px; 
            border: 1px solid #333; 
        }

        /* 게임 영역: 높이를 줄이고 중앙에 배치 */
        #canvas-container {
            flex: 0 1 45%; /* 화면의 최대 45%까지만 차지하도록 제한 */
            position: relative;
            background: #ffffff;
            margin: 0 auto;
            width: 95%;
            max-width: 500px;
            border: 2px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%;
        }

        /* 하단 입력 영역: 키보드 공간을 충분히 확보 */
        #input-box { 
            flex: 0 0 auto;
            padding: 15px 10px 30px 10px; /* 아래쪽 여백을 크게 주어 키보드 위로 올림 */
            background: #f0f8ff;
            display: flex;
            justify-content: center;
        }
        input { 
            font-size: 20px; 
            padding: 12px; 
            border-radius: 10px; 
            border: 3px solid #333; 
            width: 90%; 
            max-width: 350px;
            text-align: center; 
            outline: none; 
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="info">점수: <span id="score">0</span></div>
        <div class="info">시간: <span id="timer">02:30</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="input-box">
        <input type="text" id="answer" placeholder="기호 입력" autofocus autocomplete="off">
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const inputElement = document.getElementById('answer');

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeCanvas);
        }
        resizeCanvas();

        let score = 0;
        let timeLeft = 150; 
        let gameActive = true;
        let balloons = [];

        const elements = [
            { name: "수소", symbol: "H" }, { name: "헬륨", symbol: "He" }, { name: "리튬", symbol: "Li" },
            { name: "베릴륨", symbol: "Be" }, { name: "붕소", symbol: "B" }, { name: "탄소", symbol: "C" },
            { name: "질소", symbol: "N" }, { name: "산소", symbol: "O" }, { name: "플루오린", symbol: "F" },
            { name: "네온", symbol: "Ne" }, { name: "나트륨", symbol: "Na" }, { name: "마그네슘", symbol: "Mg" },
            { name: "알루미늄", symbol: "Al" }, { name: "규소", symbol: "Si" }, { name: "인", symbol: "P" },
            { name: "황", symbol: "S" }, { name: "염소", symbol: "Cl" }, { name: "아연", symbol: "Zn" },
            { name: "칼륨", symbol: "K" }, { name: "칼슘", symbol: "Ca" }, { name: "철", symbol: "Fe" },
            { name: "구리", symbol: "Cu" }, { name: "은", symbol: "Ag" }, { name: "금", symbol: "Au" },
            { name: "바륨", symbol: "Ba" }, { name: "수은", symbol: "Hg" }
        ];

        class Balloon {
            constructor() {
                const currentFirstLetters = balloons.map(b => b.symbol.charAt(0));
                const availableElements = elements.filter(el => {
                    const isNameDuplicate = balloons.some(b => b.name === el.name);
                    const isFirstLetterDuplicate = currentFirstLetters.includes(el.symbol.charAt(0));
                    return !isNameDuplicate && !isFirstLetterDuplicate;
                });

                let el = availableElements.length > 0 ? 
                         availableElements[Math.floor(Math.random() * availableElements.length)] :
                         elements.filter(el => !balloons.some(b => b.name === el.name))[0];

                this.name = el.name;
                this.symbol = el.symbol;
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -40;
                this.baseSize = 30; // 풍선 크기를 조금 더 작게 조정
                this.size = this.baseSize;
                this.speed = Math.random() * 0.3 + 0.3; // 더 천천히 떨어지게 조정
                this.color = `hsl(${Math.random() * 360}, 75%, 65%)`;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.size);
                ctx.lineTo(this.x, this.y + this.size + 10);
                ctx.strokeStyle = "#999";
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.stroke();

                ctx.fillStyle = "white";
                ctx.font = `bold ${this.size * 0.5}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.name, this.x, this.y);
            }

            update() {
                this.y += this.speed;
                this.size = this.baseSize + (this.y / canvas.height) * 20;
            }
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (!gameActive) { clearInterval(timerInterval); return; }
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                timerElement.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) {
                    gameActive = false;
                    alert(`시간 종료! 최종 점수: ${score}점`);
                    location.reload();
                }
            }, 1000);
        }

        function spawnBalloon() {
            if (gameActive) {
                if (balloons.length < 5) balloons.push(new Balloon());
                setTimeout(spawnBalloon, 2200);
            }
        }

        function update() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = balloons.length - 1; i >= 0; i--) {
                balloons[i].update();
                balloons[i].draw();
                if (balloons[i].y - balloons[i].size > canvas.height) {
                    balloons.splice(i, 1);
                }
            }
            requestAnimationFrame(update);
        }

        inputElement.addEventListener('input', () => {
            const val = inputElement.value.trim();
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].symbol === val) {
                    let bonus = Math.floor((1 - (balloons[i].y / canvas.height)) * 90) + 10;
                    score += bonus;
                    scoreElement.innerText = score;
                    balloons.splice(i, 1);
                    inputElement.value = "";
                    break;
                }
            }
        });

        startTimer();
        spawnBalloon();
        update();
    </script>
</body>
</html>
